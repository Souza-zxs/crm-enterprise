spring:
  application:
    name: crm-enterprise
  
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_enterprise
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  redis:
    host: localhost
    port: 6379
    timeout: 60000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: your-secret-key-change-this-in-production-environment-very-important
  expiration: 86400000

whatsapp:
  api-url: https://graph.instagram.com/v18.0
  access-token: ${WHATSAPP_ACCESS_TOKEN:your-token-here}

facebook:
  app-id: ${FACEBOOK_APP_ID:your-app-id}
  app-secret: ${FACEBOOK_APP_SECRET:your-app-secret}

google:
  ads-api-key: ${GOOGLE_ADS_API_KEY:your-api-key}

logging:
  level:
    root: INFO
    com.crm: DEBUG
